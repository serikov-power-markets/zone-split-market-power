[project]
name = "zsmp"
version = "0.1.0"
description = "Does splitting a bidding zone raise market power in the importing zone? Analytic two-node model with proofs, numerical equilibria and a check on a zonal fleet model (research study)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
